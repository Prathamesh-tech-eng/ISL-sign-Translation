import java.util.Properties

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Securely load API key from local.properties
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

android {
    namespace 'com.isl.signbridge'
    compileSdk 35

    defaultConfig {
        applicationId "com.isl.signbridge"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Expose the API key to BuildConfig (never hardcode directly!)
        buildConfigField "String", "GROQ_API_KEY", "\"${localProperties.getProperty('GROQ_API_KEY', '')}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    // Required for TFLite: prevent compression of .tflite files
    androidResources {
        noCompress.add("tflite")
    }

    // Both MediaPipe (tasks-vision:0.10.9, built on TF 2.17+) and tensorflow-lite:2.14.0
    // each bundle libtensorflowlite_jni.so. pickFirst keeps MediaPipe's NEWER copy,
    // which supports FULLY_CONNECTED op v12 that our trained models require.
    packaging {
        jniLibs {
            pickFirst '**/libtensorflowlite_jni.so'
            pickFirst '**/libtensorflowlite_gpu_jni.so'
            // Flex delegate .so — only one copy allowed; first (MediaPipe-compatible) wins
            pickFirst '**/libtensorflowlite_flex.so'
        }
    }
}

dependencies {
    // Core AndroidX
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Lifecycle & ViewModel
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // CameraX
    def camerax_version = "1.3.1"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"

    // MediaPipe Tasks Vision (Hands)
    implementation 'com.google.mediapipe:tasks-vision:0.10.9'

    // TensorFlow Lite — core runtime only (no GPU, no NNAPI, no support lib needed)
    // 2.14.0 CPU kernel supports FULLY_CONNECTED op v12; NNAPI hardware driver does NOT.
    // litert:1.0.1 conflicts with MediaPipe's bundled TFLite native lib — do not use.
    implementation 'org.tensorflow:tensorflow-lite:2.14.0'
    // SELECT_TF_OPS required at runtime: word_model uses BiLSTM (TensorListReserve flex op)
    implementation 'org.tensorflow:tensorflow-lite-select-tf-ops:2.14.0'

    // Retrofit + Gson for LLM API calls
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Kotlin Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'

    // Activity Result APIs
    implementation 'androidx.activity:activity-ktx:1.8.2'

    // Test
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
