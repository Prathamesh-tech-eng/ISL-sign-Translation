# Project-wide Gradle settings.

# AndroidX is required — app uses AndroidX dependencies
android.useAndroidX=true

# Enables Jetifier to auto-migrate legacy support libraries to AndroidX
android.enableJetifier=true

# Skip Jetifier for TFLite libs — they are already AndroidX-compatible.
# Without this, Jetifier copies the ~60MB select-tf-ops AAR to a temp folder,
# which fails when disk space is low.
android.jetifier.ignorelist=tensorflow-lite,tensorflow-lite-select-tf-ops,tensorflow-lite-gpu,tensorflow-lite-support

# Kotlin code style
kotlin.code.style=official

# Performance
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
